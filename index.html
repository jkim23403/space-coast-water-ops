<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Coast Water Ops</title>

  <style>
    :root {
      --background: #071624;
      --panel: #102b40;
      --panel-light: #163c59;
      --border: #315d76;
      --text: #f4f8fb;
      --muted: #b7cad8;
      --accent: #4bc5e8;
      --green: #43d17b;
      --yellow: #f4bd3f;
      --red: #ec6262;
      --error-bg: #5b2222;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at top right, #185276 0%, transparent 36rem),
        var(--background);
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      padding: 28px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(4, 18, 31, 0.92);
    }

    main,
    .header-content {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    main {
      padding: 24px 0 44px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 4vw, 2.35rem);
    }

    h2 {
      margin: 0 0 14px;
      font-size: 1.18rem;
    }

    .subtitle,
    .muted,
    #status,
    footer {
      color: var(--muted);
    }

    .subtitle {
      margin: 8px 0 0;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(16, 43, 64, 0.92);
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: bold;
    }

    select,
    button {
      min-height: 44px;
      padding: 0 14px;
      border-radius: 7px;
      font: inherit;
    }

    select {
      min-width: 260px;
      color: var(--text);
      border: 1px solid var(--border);
      background: #0a1d2d;
    }

    button {
      color: #042231;
      cursor: pointer;
      border: 0;
      background: var(--accent);
      font-weight: bold;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #status {
      min-height: 22px;
      margin: 0 0 16px;
    }

    .hidden {
      display: none !important;
    }

    .error {
      padding: 14px;
      margin-bottom: 16px;
      color: #ffe9e9;
      border: 1px solid var(--red);
      border-radius: 8px;
      background: var(--error-bg);
      white-space: pre-wrap;
   ```)
