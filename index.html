<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Coast Small Craft Go/No-Go Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      line-height: 1.5;
    }
    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 6px 0;
      color: #38bdf8;
      font-size: 1.5rem;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
    }
    button:hover { background: #1d4ed8; }
    #map {
      height: 400px;
      border-radius: 10px;
      margin-top: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    th, td {
      padding: 11px 10px;
      text-align: center;
      border-bottom: 1px solid #475569;
    }
    th {
      background: #0f172a;
      color: #94a3b8;
      font-size: 0.8rem;
      text-transform: uppercase;
    }
    .red { background: rgba(239, 68, 68, 0.25); }
    .yellow { background: rgba(245, 158, 11, 0.25); }
    .green { background: rgba(16, 185, 129, 0.25); }
    #status {
      margin-top: 12px;
      padding: 10px 14px;
      background: #334155;
      border-radius: 8px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="panel">
    <h1>⚓ Space Coast Small Craft Go/No-Go Dashboard</h1>
    <p style="color:#94a3b8; margin:0 0 12px 0;">Port Canaveral • Banana River • NDBC 41113</p>
    <button onclick="loadData()">↻ Refresh Data</button>
    <div id="status">Loading marine data...</div>
  </div>

  <div class="panel">
    <h2>🛰️ Satellite Map</h2>
    <div id="map"></div>
  </div>

  <div class="panel">
    <h2>📈 48-Hour Wind & Wave Chart</h2>
    <canvas id="chart" height="160"></canvas>
  </div>

  <div class="panel">
    <h2>Hourly Go / No-Go Table</h2>
    <table id="table">
      <thead>
        <tr>
          <th>Time (ET)</th>
          <th>Wind</th>
          <th>Gust</th>
          <th>Wave (ft)</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    let mapInstance = null;
    let chartInstance = null;

    async function loadData() {
      const status = document.getElementById("status");
      status.textContent = "Fetching live data from Open-Meteo...";

      try {
        const url = "https://marine-api.open-meteo.com/v1/marine?latitude=28.40&longitude=-80.53&hourly=wave_height,wind_speed_10m,wind_gusts_10m&timezone=America/New_York";
        const res = await fetch(url);
        
        if (!res.ok) throw new Error("API returned status " + res.status);
        
        const data = await res.json();

        const times = data.hourly.time;
        const wind = data.hourly.wind_speed_10m;
        const gusts = data.hourly.wind_gusts_10m;
        const waves = data.hourly.wave_height;

        // Build table
        let html = "";
        for (let i = 0; i < 48; i++) {
          const wave = waves[i];
          const gust = gusts[i];
          let statusText = "GREEN";
          let rowClass = "green";

          if (wave >= 4 || gust >= 25) {
            statusText = "RED";
            rowClass = "red";
          } else if (wave >= 2.5 || gust >= 20) {
            statusText = "YELLOW";
            rowClass = "yellow";
          }

          html += `<tr class="${rowClass}">
            <td>${times[i].slice(11, 16)}</td>
            <td>${Math.round(wind[i])}</td>
            <td>${Math.round(gust)}</td>
            <td>${wave.toFixed(1)}</td>
            <td><strong>${statusText}</strong></td>
          </tr>`;
        }
        document.querySelector("#table tbody").innerHTML = html;

        // Chart
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(document.getElementById("chart"), {
          type: "line",
          data: {
            labels: times.slice(0, 48).map(t => t.slice(11, 16)),
            datasets: [
              {
                label: "Wave Height (ft)",
                data: waves.slice(0, 48),
                borderColor: "#38bdf8",
                tension: 0.3,
                borderWidth: 2.5
              },
              {
                label: "Wind (mph)",
                data: wind.slice(0, 48),
                borderColor: "#facc15",
                tension: 0.3,
                borderWidth: 2.5
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { labels: { color: "#e2e8f0" } }
            },
            scales: {
              x: { ticks: { color: "#94a3b8" } },
              y: { ticks: { color: "#94a3b8" }, beginAtZero: true }
            }
          }
        });

        // Map (only create once)
        if (!mapInstance) {
          mapInstance = L.map("map").setView([28.41, -80.55], 11);
          L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
            attribution: "© Esri"
          }).addTo(mapInstance);
          L.marker([28.40, -80.53]).addTo(mapInstance)
            .bindPopup("<b>NDBC 41113</b><br>Cape Canaveral Nearshore");
        }

        status.innerHTML = "✅ Data loaded successfully! Last updated: " + 
          new Date().toLocaleTimeString("en-US", { timeZone: "America/New_York" }) + " ET";

      } catch (err) {
        console.error(err);
        status.innerHTML = "❌ Error loading data: " + err.message + 
          "<br>Please check your internet connection and try again.";
      }
    }

    // Load data when the page opens
    window.onload = loadData;
  </script>
</body>
</html>
