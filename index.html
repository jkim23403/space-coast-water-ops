<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Coast Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body { background:#0f172a; color:#e2e8f0; font-family:Arial,sans-serif; margin:0; padding:20px; }
    .panel { background:#1e293b; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:20px; }
    h1 { color:#38bdf8; }
    button { background:#2563eb; color:white; border:none; padding:12px 24px; border-radius:8px; cursor:pointer; }
    #status { padding:12px; background:#334155; border-radius:8px; margin:10px 0; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:12px; text-align:center; border-bottom:1px solid #475569; }
    .red { background:rgba(239,68,68,0.3); }
    .yellow { background:rgba(245,158,11,0.3); }
    .green { background:rgba(16,185,129,0.3); }
  </style>
</head>
<body>

  <div class="panel">
    <h1>⚓ Space Coast Small Craft Go/No-Go</h1>
    <button onclick="loadData()">Refresh Data</button>
    <div id="status">Loading...</div>
  </div>

  <div class="panel">
    <h2>48 Hour Chart</h2>
    <canvas id="chart" height="180"></canvas>
  </div>

  <div class="panel">
    <h2>Table</h2>
    <table id="table">
      <thead><tr><th>Time</th><th>Wind</th><th>Gust</th><th>Wave</th><th>Status</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
