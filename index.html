<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Coast Dashboard - Debug</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body { background: #0f172a; color: #e2e8f0; font-family: Arial, sans-serif; margin:0; padding:20px; }
    .panel { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    #status { padding: 15px; background: #334155; border-radius: 8px; font-size: 1rem; margin: 10px 0; white-space: pre-wrap; }
  </style>
</head>
<body>

  <div class="panel">
    <h1>Space Coast Dashboard - Debug Mode</h1>
    <button onclick="loadData()" style="padding:12px 20px; font-size:16px;">Run Data Test</button>
  </div>

  <div class="panel">
    <h2>Results</h2>
    <div id="status">Click the button above to test data loading...</div>
  </div>

  <script>
    async function loadData() {
      const status = document.getElementById("status");
      status.innerHTML = "Starting test...\n";

      const url = "https://marine-api.open-meteo.com/v1/marine?latitude=28.40&longitude=-80.53&hourly=wave_height,wind_speed_10m,wind_gusts_10m&timezone=America/New_York";

      try {
        status.innerHTML += "Fetching data from Open-Meteo...\n";
        const res = await fetch(url);
        status.innerHTML += `Status: ${res.status} ${res.statusText}\n`;

        const data = await res.json();
        status.innerHTML += `✅ Success! Received ${data.hourly.time.length} hours of data.\n\n`;
        status.innerHTML += `First time: ${data.hourly.time[0]}\n`;
        status.innerHTML += `First wind: ${data.hourly.wind_speed_10m[0]} m/s\n`;
        status.innerHTML += `First wave: ${data.hourly.wave_height[0]} meters\n\n`;
        status.innerHTML += "✅ Data is flowing correctly!\nYou can now replace this with the full dashboard.";

      } catch (err) {
        status.innerHTML += `❌ ERROR: ${err.message}`;
        console.error(err);
      }
    }
  </script>
</body>
</html>
