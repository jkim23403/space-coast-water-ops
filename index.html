<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Coast Dashboard - Diagnostic</title>
  <style>
    body { background: #0f172a; color: #f1f5f9; font-family: system-ui, sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
    .box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    h1 { margin-top: 0; }
    button { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 1rem; }
    pre { background: #0b1120; padding: 14px; border-radius: 8px; overflow-x: auto; font-size: 0.85rem; white-space: pre-wrap; }
    .ok { color: #6ee7b7; }
    .err { color: #fca5a5; }
  </style>
</head>
<body>
  <div class="box">
    <h1>⚓ Space Coast Data Diagnostic</h1>
    <p>This page will test if the weather/wave data can load.</p>
    <button onclick="runTest()">▶ Run Data Test</button>
  </div>

  <div class="box">
    <h2>Results</h2>
    <div id="output">Click the button above to start the test...</div>
  </div>

  <script>
    async function runTest() {
      const out = document.getElementById('output');
      out.innerHTML = '<p>Testing...</p>';

      let log = '';

      function add(msg, isError = false) {
        log += `<div class="${isError ? 'err' : 'ok'}">${msg}</div>`;
        out.innerHTML = log;
      }

      try {
        add('1. Starting test...');

        // Test 1: Basic connectivity
        add('2. Testing Open-Meteo Weather API...');
        const weatherUrl = 'https://api.open-meteo.com/v1/forecast?latitude=28.40&longitude=-80.53&hourly=wind_speed_10m,wind_gusts_10m&forecast_days=2&timezone=America/New_York';
        const weatherRes = await fetch(weatherUrl);
        add(`   Weather status: ${weatherRes.status} ${weatherRes.statusText}`);

        if (!weatherRes.ok) throw new Error('Weather API failed with status ' + weatherRes.status);

        const weatherData = await weatherRes.json();
        add(`   ✅ Weather data received! Hours: ${weatherData.hourly.time.length}`);
        add(`   First wind value: ${weatherData.hourly.wind_speed_10m[0]} m/s`);

        // Test 2: Marine API
        add('3. Testing Open-Meteo Marine API...');
        const marineUrl = 'https://marine-api.open-meteo.com/v1/marine?latitude=28.40&longitude=-80.53&hourly=wave_height,wave_period&forecast_days=2&timezone=America/New_York';
        const marineRes = await fetch(marineUrl);
        add(`   Marine status: ${marineRes.status} ${marineRes.statusText}`);

        if (!marineRes.ok) throw new Error('Marine API failed with status ' + marineRes.status);

        const marineData = await marineRes.json();
        add(`   ✅ Marine data received! Hours: ${marineData.hourly.time.length}`);
        add(`   First wave height: ${marineData.hourly.wave_height[0]} meters`);

        // Test 3: Show sample of next few hours
        add('<br><strong>Sample of next 6 hours:</strong>');
        let sample = '';
        for (let i = 0; i < 6; i++) {
          const time = weatherData.hourly.time[i].slice(11,16);
          const wind = (weatherData.hourly.wind_speed_10m[i] * 1.94384).toFixed(1);
          const wave = (marineData.hourly.wave_height[i] * 3.28084).toFixed(1);
          sample += `${time} ET → Wind ${wind} kt | Wave ${wave} ft<br>`;
        }
        add(sample);

        add('<br><strong class="ok">✅ SUCCESS! Both APIs are working. Data can be loaded.</strong>');
        add('You can now go back to the full dashboard version.');

      } catch (err) {
        add('<br>❌ ERROR: ' + err.message, true);
        add('This means the browser cannot reach Open-Meteo from your network.', true);
        add('Possible causes: ad-blocker, corporate firewall, offline, or CORS issue.', true);
        console.error(err);
      }
    }

    // Auto-run on load
    window.onload = runTest;
  </script>
</body>
</html>
